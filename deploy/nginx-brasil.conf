# brasil.leadsallyearlong.space: Node server (brasil-bullion-2.service) on 127.0.0.1:3094.
# Deploy: cd /var/www/brasil-bullion-2 && NITRO_PRESET=node-server npm run build && systemctl restart brasil-bullion-2
server {
    server_name brasil.leadsallyearlong.space;

    # Only Cloudflare may connect, so CF-Connecting-IP / CF-IPCountry can be trusted.
    include /etc/nginx/snippets/cloudflare-only.conf;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\.(?!well-known) { return 404; }

    # Hashed build assets: served from disk, cached long
    location /assets/ {
        root /var/www/brasil-bullion-2/.output/public;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /api/submit-lead {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3094;
        include /var/www/brasil-bullion-2/deploy/nginx-proxy-headers.conf;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3094;
        include /var/www/brasil-bullion-2/deploy/nginx-proxy-headers.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brasil.leadsallyearlong.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brasil.leadsallyearlong.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = brasil.leadsallyearlong.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name brasil.leadsallyearlong.space;
    return 404; # managed by Certbot


}